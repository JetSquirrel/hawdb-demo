<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e0d" />
    <meta name="description" content="HawDB and gpui-graph running together in one browser WebAssembly module." />
    <title>HawDB Graph Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="loading" role="status">
      <div class="mark"><i></i><i></i><i></i></div>
      <strong>Starting HawDB Graph Demo</strong>
      <span>Loading the unified WebAssembly module…</span>
      <progress max="1" aria-label="WASM download progress"></progress>
      <button id="retry" hidden>Retry</button>
    </div>
    <script>
      window.showBootError = function (message) {
        const loading = document.getElementById("loading");
        if (!loading) return;
        loading.classList.add("error");
        loading.querySelector("strong").textContent = "Could not start HawDB Graph Demo";
        loading.querySelector("span").textContent = message;
        loading.querySelector("progress").hidden = true;
        document.getElementById("retry").hidden = false;
      };
      document.getElementById("retry").onclick = function () { location.reload(); };
      window.bootWatchdog = setTimeout(function () {
        if (!window.hawdbBootStarted) window.showBootError("Application code did not load. Check your connection and retry.");
      }, 30000);
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
