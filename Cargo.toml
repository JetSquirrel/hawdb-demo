[package]
name = "hawdb-wasm-demo"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hawdb = { git = "https://github.com/nowledge-co/hawdb", rev = "032296335928261a17d7c98088cee7e1c869957c", default-features = false }
gpui-graph = { git = "https://github.com/JetSquirrel/gpui-graph", rev = "76bb32e34a8570319db0c91d051914f7b1b45feb" }
gpui-base = "=0.7.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
